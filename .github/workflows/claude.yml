name: Claude AI Pull Request Reviewer
# On-demand PR review: mention @claude in a PR comment, review, or inline comment,
# e.g. "@claude review this PR". Claude does whatever the comment asks.
# CI Claude gets no project context (CLAUDE.md is not in git).
# Auth: GITHUB_TOKEN (not the Claude GitHub App), so the job permissions below
# are the real limit. contents: read -> Claude can comment but cannot push.
# Fork and Dependabot PRs get no secrets on these events and will not run.
on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment'
        && github.event.issue.pull_request
        && github.event.issue.state == 'open'
        && contains(github.event.comment.body, '@claude')
        && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)) ||
      (github.event_name == 'pull_request_review_comment'
        && github.event.pull_request.state == 'open'
        && contains(github.event.comment.body, '@claude')
        && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)) ||
      (github.event_name == 'pull_request_review'
        && github.event.pull_request.state == 'open'
        && contains(github.event.review.body, '@claude')
        && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.review.author_association))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
      issues: write
      actions: read
    steps:
      - id: checkout
        name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - id: claude-code-action
        name: Claude Code Action
        uses: anthropics/claude-code-action@f3b070c88125d33dbae5653df5f143101d4ea9dc # v1.0.276
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          # No `prompt` on purpose: with a prompt, comment events run in agent mode
          # and the comment text is ignored (unless track_progress forces tag mode).
          # Tag mode answers what the comment asks and reports in one tracking comment.
          # No Bash(gh pr comment:*): extra top-level comments would duplicate it.
          # --append-system-prompt: single quotes only (shell-quote parses this;
          # double quotes would expand $). No line inside may start with a hash
          # sign: the action strips such lines even inside quotes.
          claude_args: |
            --max-turns 25
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr diff:*),Bash(gh pr view:*)"
            --append-system-prompt 'Project context for reviewing Env::Assert, a Perl CPAN distribution:
            - Minimum perl is 5.010 (dist.ini). Flag syntax or core modules newer than that.
            - Style is enforced by .perlcriticrc (severity brutal) and .perltidyrc. Do not repeat what they catch.
            - Must work on Windows: check paths, line endings and shell quoting.
            - Changes to lib/ or bin/envassert must also update envassert.self-contained (fatpacked copy).
            - Tests use Test2. New behaviour needs tests under t/.
            - Flag any non-ASCII character in code or docs (Trojan Source risk).
            - Report defects only. No praise, no summary of what the PR does.'
